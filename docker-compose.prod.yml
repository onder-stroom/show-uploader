# Production stack for netcup-comingsoon (Komodo + Traefik).
# App:   https://uploader.coming-soon.space
# Minio: https://minio-uploader.coming-soon.space  (S3 API, presigned URLs)
#
# Requires the external Traefik network `reverse-proxy` and cert resolver
# `myresolver` (same as the other coming-soon stacks). Inter-service traffic
# uses the isolated `default` network; only api + minio join reverse-proxy.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VITE_ZITADEL_DOMAIN: ${ZITADEL_DOMAIN}
        VITE_ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
        VITE_POCKETBASE_URL: ${POCKETBASE_URL}
    # Rebuild from source on every deploy (Komodo runs `compose up`, which
    # otherwise reuses the cached image and ships stale code).
    pull_policy: build
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=https://minio-uploader.coming-soon.space
      # PocketBase runs on the same host — reach it over the shared Traefik
      # network to avoid NAT hairpin. Browser file links still use POCKETBASE_URL.
      - POCKETBASE_INTERNAL_URL=http://radio-pocketbase:8090
      # Same var as the worker's, below — needed here too for the one-time
      # archiveLinksBackfill mutation, which writes the same permanent
      # recording links the worker writes per-upload as archive jobs finish.
      - APP_PUBLIC_URL=https://uploader.coming-soon.space
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    volumes:
      # Read-only, purely so the storage page can report real disk figures for
      # the dedicated object-store disk and the worker's scratch space. The api
      # never writes to either.
      - /mnt/storage:/mnt/storage:ro
      - worker_tmp:/tmp/show-uploader:ro
    networks:
      - default
      - reverse-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.show-uploader.rule=Host(`uploader.coming-soon.space`)
      - traefik.http.routers.show-uploader.entrypoints=websecure
      - traefik.http.routers.show-uploader.tls.certresolver=myresolver
      - traefik.http.services.show-uploader.loadbalancer.server.port=3000

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    pull_policy: build
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      # Write published results back to the PocketBase archive record via the api
      # (which holds the PB superuser). Same isolated network, api listens on 3000.
      - INTERNAL_API_URL=http://api:3000/api
      # Public base for the permanent recording links written onto the agenda
      # records. Browsers open these, so it must be the external host.
      - APP_PUBLIC_URL=https://uploader.coming-soon.space
      # Reach PocketBase over the shared network to fetch a record's cover image
      # for the MixCloud upload (the public host isn't reachable from inside — NAT
      # hairpin). POCKETBASE_URL (the public base to rewrite from) comes from .env.
      - POCKETBASE_INTERNAL_URL=http://radio-pocketbase:8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
    volumes:
      # Multi-GB scratch belongs on a volume, not the container's writable layer,
      # and it has to outlive a restart so the startup sweeper can reclaim what a
      # killed job left behind.
      - worker_tmp:/tmp/show-uploader
    networks:
      # reverse-proxy is the shared external network where radio-pocketbase lives.
      - default
      - reverse-proxy

  # The app's own database, replacing Neon. Never published to the host or to
  # Traefik: only the api and worker reach it, over the isolated `default`
  # network, which is also why it needs no TLS (see api/src/db/client.ts).
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # On the dedicated disk, beside the object store — the root filesystem is
      # small and this has to survive a stack rebuild.
      - /mnt/storage/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # api and worker wait on this: both crash on boot without a database.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

  # Neon kept backups for us; self-hosting means taking our own. A plain nightly
  # pg_dump of an 11MB database, 14 kept — restore with:
  #   docker compose exec -T postgres psql -U $POSTGRES_USER $POSTGRES_DB < dump.sql
  postgres-backup:
    image: postgres:17-alpine
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /mnt/storage/backups/postgres:/backups
    entrypoint: >
      /bin/sh -c "
        while true; do
          out=/backups/show-uploader-$$(date +%Y-%m-%d).sql;
          PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} $${POSTGRES_DB} > $$out.tmp &&
            mv $$out.tmp $$out && echo \"backed up to $$out\" ||
            echo 'backup FAILED';
          find /backups -name 'show-uploader-*.sql' -mtime +14 -delete;
          sleep 86400;
        done
      "
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - default

  minio:
    # minio/minio was pulled from Docker Hub — quay.io/minio/minio is the only
    # registry MinIO still publishes to. Pinned rather than :latest since an
    # unattended host has no one watching for a breaking upgrade.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      # Object data on the dedicated /dev/vda3 disk (mounted at /mnt/storage).
      - /mnt/storage/minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - reverse-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.routers.show-uploader-minio.rule=Host(`minio-uploader.coming-soon.space`)
      - traefik.http.routers.show-uploader-minio.entrypoints=websecure
      - traefik.http.routers.show-uploader-minio.tls.certresolver=myresolver
      - traefik.http.routers.show-uploader-minio.service=show-uploader-minio
      - traefik.http.services.show-uploader-minio.loadbalancer.server.port=9000
      # The console minio already runs (--console-address above) is the object
      # browser: upload, download, delete, preview, share links, and it cannot
      # drift from the bucket because it IS the bucket's own tool. It only ever
      # needed a route. Separate router + service because a container exposing
      # two ports needs each router bound to its own service explicitly.
      - traefik.http.routers.show-uploader-console.rule=Host(`console-uploader.coming-soon.space`)
      - traefik.http.routers.show-uploader-console.entrypoints=websecure
      - traefik.http.routers.show-uploader-console.tls.certresolver=myresolver
      - traefik.http.routers.show-uploader-console.service=show-uploader-console
      - traefik.http.services.show-uploader-console.loadbalancer.server.port=9001
  # Bucket creation moved into the api (ensureBucket on startup) — no more
  # one-shot minio-init container, which lingered as Exited(0) and read as
  # "unhealthy". Object prefixes (uploads/archive/…) are created on first PUT.

volumes:
  redis_data:
  worker_tmp:

networks:
  default:
  reverse-proxy:
    external: true
